# YOLOv8l dengan Coordinate Attention pada Layer P4 (Backbone)
nc: 3
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 3, C2f, [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, C2f, [256, True]]          # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 6, C2f, [512, True]]          # 6
  - [-1, 1, CoordinateAttention, [512]] # 7: <<-- INJEKSI CA DI P4 (Res 40x40)
  - [-1, 1, Conv, [512, 3, 2]]         # 8-P5/32
  - [-1, 3, C2f, [512, True]]          # 9
  - [-1, 1, SPPF, [512, 5]]            # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 7], 1, Concat, [1]]                   # 12: Sambung dengan output CA P4 (layer 7)
  - [-1, 3, C2f, [512]]                         # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15: Sambung dengan backbone P3 (layer 4)
  - [-1, 3, C2f, [256]]                         # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18: Sambung dengan head P4 (layer 13)
  - [-1, 3, C2f, [512]]                         # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21: Sambung dengan output SPPF P5 (layer 10)
  - [-1, 3, C2f, [512]]                         # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]             # 23: Detect(P3, P4, P5)